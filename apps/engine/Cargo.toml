[package]
name = "karakeep-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
feed-rs = "2"
encoding_rs = "0.8"
futures-util = "0.3"
html2text = "0.16"
ipnet = "2"
quick-xml = "0.41"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "gzip", "brotli", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiktoken-rs = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process", "io-util", "fs", "net", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
